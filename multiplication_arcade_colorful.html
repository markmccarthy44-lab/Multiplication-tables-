<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplication Arcade</title><style>*{box-sizing:border-box} :root{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 8%,#774de9 0,transparent 33%),radial-gradient(circle at 95% 70%,#d03da6 0,transparent 35%),linear-gradient(145deg,#10173f,#29145c 55%,#171d4b);padding:24px 16px 60px;overflow-x:hidden}body:before{content:'✦  ✧      ✦       ✧        ✦';position:fixed;top:8%;left:3%;right:3%;font-size:40px;letter-spacing:2.3rem;opacity:.12;pointer-events:none}main{max-width:620px;margin:auto;position:relative}h1{text-align:center;font-size:clamp(29px,7vw,46px);line-height:1.12;letter-spacing:-1px;margin:18px 0 10px;text-shadow:0 5px 20px #0007}main>p{color:#e4dafa;font-size:15px;margin:0 0 24px}p{text-align:center;color:#e5dafa;line-height:1.55}.panel{background:linear-gradient(155deg,#ffffff26,#ffffff0e);border:2px solid #ffffff55;border-radius:32px;padding:clamp(20px,5vw,32px);box-shadow:0 20px 60px #08062570,inset 0 1px #ffffff65;backdrop-filter:blur(14px)}h2{font-size:26px;margin:4px 0 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:4px 0 22px;font-weight:800;flex-wrap:wrap}.pill{border-radius:99px;background:#1b174b90;border:1px solid #ffffff4a;padding:10px 12px;font-size:clamp(12px,3vw,15px)}.lessons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.lesson,.answer,.action{border:0;cursor:pointer;font-weight:900;transition:transform .12s,box-shadow .12s}.lesson:hover,.answer:hover:not(:disabled),.action:hover{transform:translateY(-3px)}.lesson:active,.answer:active,.action:active{transform:scale(.97)}.lesson{border-radius:20px;padding:17px 0;background:linear-gradient(160deg,#f5efff,#c9c5ff);color:#38236e;font-size:26px;box-shadow:0 5px 0 #8375c6}.lesson.selected{background:linear-gradient(160deg,#fff6a6,#ffb837);color:#563500;box-shadow:0 5px 0 #cc7a12,0 0 0 3px #fff}.action{background:linear-gradient(135deg,#ffe57d,#ffae35);color:#49245d;padding:18px 20px;font-size:19px;width:100%;border-radius:20px;box-shadow:0 7px 0 #d17b2a,0 14px 25px #0004;margin-bottom:7px}.answer{background:linear-gradient(160deg,#fff,#e7eaff);color:#232253;font-size:clamp(29px,7vw,39px);padding:19px 8px;min-height:93px;border-radius:23px;box-shadow:0 7px 0 #a3a6d3,0 11px 18px #0004}.answer:disabled{cursor:default}.answer.good{background:linear-gradient(135deg,#9fffd4,#46d9a0);color:#0a503b;box-shadow:0 7px 0 #258b68}.answer.bad{background:linear-gradient(135deg,#ffc4d1,#ff698c);color:#761938;box-shadow:0 7px 0 #c53d61;opacity:.6}.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}.question{background:linear-gradient(135deg,#5434ac,#8150e2);border:2px solid #ffffff55;border-radius:28px;text-align:center;font-size:clamp(47px,11vw,78px);font-weight:1000;letter-spacing:-2px;padding:29px 4px;margin:24px 0 26px;box-shadow:inset 0 2px #ffffff44,0 12px 30px #0004;text-shadow:0 4px 0 #35207c}.progress{height:16px;background:#080f3d8c;border-radius:20px;overflow:hidden;border:1px solid #ffffff50}.bar{height:100%;background:linear-gradient(90deg,#ffce54,#fff48b);transition:width .35s}.feedback{font-size:20px;font-weight:900;min-height:42px;text-align:center;margin:24px 0 8px;color:#fff3b1}.muted{color:#ddd}#game,#results{display:none}.scorebig{font-size:clamp(43px,10vw,65px);font-weight:1000;text-align:center;color:#ffdc68;text-shadow:0 5px #9e5a32}.stars{text-align:center;font-size:55px;margin:20px 0}.smallbtn{background:#ffffff1e;border:1px solid #ffffff77;color:white;border-radius:15px;padding:14px;cursor:pointer;font-weight:800;font-size:15px}.confetti{position:fixed;pointer-events:none;font-size:28px;animation:fly .85s ease-out forwards;z-index:5}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(450deg);opacity:0}}label{display:flex;align-items:center;gap:9px;font-weight:700;background:#15144e7c;padding:12px;border-radius:14px}input[type=checkbox]{accent-color:#ffc64f;width:19px;height:19px}#results h2{font-size:32px}#missed{background:#160d4e70;border-radius:14px;padding:12px}button:focus-visible{outline:4px solid #fff;outline-offset:4px}@media(max-width:380px){.panel{padding:16px}.pill{padding:8px}.question{padding:22px 3px}.answer{min-height:80px}.lessons{gap:8px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}</style></head><body><main><h1>🚀 TIMES TABLE ARCADE</h1><p>✨ 7 challenges per level · 3× through 9× · Collect stars! ✨</p><section class="panel" id="start"><h2>🎮 Choose Your Level</h2><div class="lessons" id="lessons"></div><label><input type="checkbox" id="sound" checked> 🔊 Game sounds</label><p>10 points for each correct answer + 5 bonus points for every 3 correct in a row!</p><button class="action" id="startBtn">Let's Play! ▶</button></section><section class="panel" id="game"><div class="top"><span class="pill" id="round"></span><span class="pill" id="score"></span><span class="pill" id="streak"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="action" id="next" style="display:none">Next Question ➜</button></section><section class="panel" id="results"><h2 style="text-align:center">🏆 Lesson Complete!</h2><div class="stars" id="stars"></div><div class="scorebig" id="final"></div><p id="summary"></p><p id="missed"></p><button class="action" id="nextLesson">Load Next Lesson ➜</button><button class="smallbtn" id="again" style="width:100%;margin-top:12px">Replay This Lesson ↻</button><button class="smallbtn" id="choose" style="width:100%;margin-top:12px">Choose Another Lesson</button></section></main><script>let table=3,items=[],idx=0,points=0,correct=0,streak=0,misses=[],locked=false,hadMiss=false,advanceTimer=null;const $=id=>document.getElementById(id);const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};for(let i=3;i<=9;i++){let b=document.createElement('button');b.className='lesson'+(i===3?' selected':'');b.textContent=i;b.onclick=()=>{table=i;document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('lessons').append(b)}function show(id){['start','game','results'].forEach(x=>$(x).style.display=x===id?'block':'none')}function sound(ok){if(!$('sound').checked)return;try{let C=window.AudioContext||window.webkitAudioContext,ctx=new C();let notes=ok?[523,659,784,1047]:[260,195];notes.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.11;o.type=ok?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.19);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.21)});setTimeout(()=>ctx.close(),1200)}catch(e){}}function burst(){for(let i=0;i<15;i++){let s=document.createElement('span');s.className='confetti';s.textContent=['⭐','✨','🎉','💛'][i%4];s.style.left=(25+Math.random()*50)+'vw';s.style.top='43vh';s.style.setProperty('--x',(Math.random()*400-200)+'px');s.style.setProperty('--y',(Math.random()*-320-40)+'px');document.body.append(s);setTimeout(()=>s.remove(),900)}}function options(n){let right=table*n,set=new Set([right]);let pool=[];for(let i=3;i<=9;i++)pool.push(table*i);for(let v of [right+table,right-table,right+1,right-1,right+10,right-10,...shuffle(pool)])if(v>0&&v!==right)set.add(v);let a=shuffle([...set].filter(x=>x>0&&x!==right)).slice(0,3);return shuffle([right,...a])}function render(){locked=false;hadMiss=false;let n=items[idx];$('round').textContent=`Card ${idx+1}/7`;$('score').textContent=`⭐ ${points} pts`;$('streak').textContent=`🔥 ${streak} streak`;$('bar').style.width=(idx/7*100)+'%';$('question').textContent=`${table} × ${n} = ?`;$('feedback').textContent='';$('next').style.display='none';$('answers').innerHTML='';options(n).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>answer(v,b);$('answers').append(b)})}function answer(v,button){if(locked||button.disabled)return;let n=items[idx],right=table*n,ok=v===right;if(ok){locked=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);button.classList.add('good');if(!hadMiss){correct++;streak++;points+=10;let bonus=streak%3===0;if(bonus)points+=5;$('feedback').textContent=bonus?'🎉 AMAZING! +15 points!':'🌟 Correct! +10 points!'}else{$('feedback').textContent='🌟 You got it! Keep going!'}sound(true);burst();$('score').textContent=`⭐ ${points} pts`;$('streak').textContent=`🔥 ${streak} streak`;advanceTimer=setTimeout(advance,550)}else{button.disabled=true;button.classList.add('bad');if(!hadMiss){hadMiss=true;streak=0;misses.push(`${table} × ${n} = ${right}`)}$('feedback').textContent='💪 Oops! Try another one!';sound(false);$('streak').textContent=`🔥 ${streak} streak`}}function advance(){advanceTimer=null;idx++;if(idx===7){show('results');$('stars').textContent=correct===7?'⭐⭐⭐':correct>=5?'⭐⭐':correct>=3?'⭐':'💪';$('final').textContent=`${points} POINTS`;$('summary').textContent=`${correct} of 7 correct on the first try (${Math.round(correct/7*100)}%) on the ${table} times table!`;$('nextLesson').textContent=table<9?`Load Next Lesson: ${table+1}× ➜`:'All Lessons Complete! 🏆';$('missed').textContent=misses.length?'Practice these again: '+misses.join(' • '):'PERFECT! Every answer was right on the first try!';if(correct>=5){sound(true);burst()}}else render()}
function start(){if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null}items=shuffle([3,4,5,6,7,8,9]);idx=0;points=0;correct=0;streak=0;misses=[];show('game');render()}$('nextLesson').onclick=()=>{if(table<9){table++;start()}else{show('start');document.querySelectorAll('.lesson').forEach((b,i)=>b.classList.toggle('selected',i===table-3));}};$('startBtn').onclick=start;$('again').onclick=start;$('choose').onclick=()=>show('start');</script></body></html>
