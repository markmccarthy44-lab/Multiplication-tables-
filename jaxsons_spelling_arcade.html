<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxson’s Spelling Arcade</title><style>*{box-sizing:border-box} :root{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 8%,#774de9 0,transparent 33%),radial-gradient(circle at 95% 70%,#d03da6 0,transparent 35%),linear-gradient(145deg,#10173f,#29145c 55%,#171d4b);padding:24px 16px 60px;overflow-x:hidden}body:before{content:'✦  ✧      ✦       ✧        ✦';position:fixed;top:8%;left:3%;right:3%;font-size:40px;letter-spacing:2.3rem;opacity:.12;pointer-events:none}main{max-width:620px;margin:auto;position:relative}h1{text-align:center;font-size:clamp(29px,7vw,46px);line-height:1.12;letter-spacing:-1px;margin:18px 0 10px;text-shadow:0 5px 20px #0007}main>p{color:#e4dafa;font-size:15px;margin:0 0 24px}p{text-align:center;color:#e5dafa;line-height:1.55}.panel{background:linear-gradient(155deg,#ffffff26,#ffffff0e);border:2px solid #ffffff55;border-radius:32px;padding:clamp(20px,5vw,32px);box-shadow:0 20px 60px #08062570,inset 0 1px #ffffff65;backdrop-filter:blur(14px)}h2{font-size:26px;margin:4px 0 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:4px 0 22px;font-weight:800;flex-wrap:wrap}.pill{border-radius:99px;background:#1b174b90;border:1px solid #ffffff4a;padding:10px 12px;font-size:clamp(12px,3vw,15px)}.lessons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.lesson,.answer,.action{border:0;cursor:pointer;font-weight:900;transition:transform .12s,box-shadow .12s}.lesson:hover,.answer:hover:not(:disabled),.action:hover{transform:translateY(-3px)}.lesson:active,.answer:active,.action:active{transform:scale(.97)}.lesson{border-radius:20px;padding:17px 0;background:linear-gradient(160deg,#f5efff,#c9c5ff);color:#38236e;font-size:26px;box-shadow:0 5px 0 #8375c6}.lesson.selected{background:linear-gradient(160deg,#fff6a6,#ffb837);color:#563500;box-shadow:0 5px 0 #cc7a12,0 0 0 3px #fff}.action{background:linear-gradient(135deg,#ffe57d,#ffae35);color:#49245d;padding:18px 20px;font-size:19px;width:100%;border-radius:20px;box-shadow:0 7px 0 #d17b2a,0 14px 25px #0004;margin-bottom:7px}.answer{background:linear-gradient(160deg,#fff,#e7eaff);color:#232253;font-size:clamp(29px,7vw,39px);padding:19px 8px;min-height:93px;border-radius:23px;box-shadow:0 7px 0 #a3a6d3,0 11px 18px #0004}.answer:disabled{cursor:default}.answer.good{background:linear-gradient(135deg,#9fffd4,#46d9a0);color:#0a503b;box-shadow:0 7px 0 #258b68}.answer.bad{background:linear-gradient(135deg,#ffc4d1,#ff698c);color:#761938;box-shadow:0 7px 0 #c53d61;opacity:.6}.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}.question.word{font-size:clamp(21px,5vw,31px);line-height:1.4;letter-spacing:0;padding:27px 18px;text-shadow:none}.question{background:linear-gradient(135deg,#5434ac,#8150e2);border:2px solid #ffffff55;border-radius:28px;text-align:center;font-size:clamp(47px,11vw,78px);font-weight:1000;letter-spacing:-2px;padding:29px 4px;margin:24px 0 26px;box-shadow:inset 0 2px #ffffff44,0 12px 30px #0004;text-shadow:0 4px 0 #35207c}.progress{height:16px;background:#080f3d8c;border-radius:20px;overflow:hidden;border:1px solid #ffffff50}.bar{height:100%;background:linear-gradient(90deg,#ffce54,#fff48b);transition:width .35s}.feedback{font-size:20px;font-weight:900;min-height:42px;text-align:center;margin:24px 0 8px;color:#fff3b1}.muted{color:#ddd}#game,#results{display:none}.scorebig{font-size:clamp(43px,10vw,65px);font-weight:1000;text-align:center;color:#ffdc68;text-shadow:0 5px #9e5a32}.stars{text-align:center;font-size:55px;margin:20px 0}.smallbtn{background:#ffffff1e;border:1px solid #ffffff77;color:white;border-radius:15px;padding:14px;cursor:pointer;font-weight:800;font-size:15px}.confetti{position:fixed;pointer-events:none;font-size:28px;animation:fly .85s ease-out forwards;z-index:5}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(450deg);opacity:0}}label{display:flex;align-items:center;gap:9px;font-weight:700;background:#15144e7c;padding:12px;border-radius:14px}input[type=checkbox]{accent-color:#ffc64f;width:19px;height:19px}#results h2{font-size:32px}#missed{background:#160d4e70;border-radius:14px;padding:12px}button:focus-visible{outline:4px solid #fff;outline-offset:4px}@media(max-width:380px){.panel{padding:16px}.pill{padding:8px}.question{padding:22px 3px}.answer{min-height:80px}.lessons{gap:8px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
.spell{width:100%;border:3px solid #c9c5ff;border-radius:18px;padding:18px;font:700 26px system-ui;color:#232253;margin:18px 0;background:white}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{flex:1}.question.word{font-size:29px}#next{display:none}.feedback{min-height:65px}#audioStatus{font-size:14px} .action:disabled{opacity:.5;cursor:default}</style></head><body><main><h1>🚀 JAXSON’S SPELLING ARCADE</h1><p>🔊 Listen · ✍️ Spell · ⭐ Celebrate</p>
<section class="panel" id="start"><h2>🎮 Ready to spell?</h2><p>12 words: plural endings and everyday spelling challenges. Listen carefully—the spelling stays hidden!</p><p>Two tries per word. First try: 20 points. Second try: 10 points.</p><button class="action" id="startBtn">Let’s Play! ▶</button><p id="support" role="status"></p></section>
<section class="panel" id="game"><div class="top"><span class="pill" id="round"></span><span class="pill" id="score"></span><span class="pill" id="streak"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question word">🔊 Listen, then spell!</div><div class="controls"><button class="smallbtn" id="hear" type="button">🔊 Hear the Word</button><button class="smallbtn" id="sentence" type="button">📖 Hear a Sentence</button></div><p id="audioStatus" role="status"></p><form id="spellForm" autocomplete="off"><label for="spelling">Your spelling</label><input class="spell" id="spelling" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-describedby="feedback"><button class="action" id="check" type="submit">Check My Spelling ✓</button></form><div class="feedback" id="feedback" aria-live="polite"></div><button class="action" id="next" type="button">Next Word ➜</button></section>
<section class="panel" id="results"><h2 style="text-align:center">🏆 Spelling Complete!</h2><div class="stars" id="stars"></div><div class="scorebig" id="final"></div><p id="summary"></p><p id="missed"></p><button class="action" id="again">Play Again ↻</button><button class="smallbtn" id="review" style="width:100%;margin-top:12px">Practice Missed Words</button></section></main><script>
const words=[
{word:'classes',single:'class',sentence:'Jaxson has different classes at school.'},
{word:'boxes',single:'box',sentence:'Grandpa Mark put the toys into two boxes.'},
{word:'dishes',single:'dish',sentence:'Jackie washed the dishes after dinner.'},
{word:'wishes',single:'wish',sentence:'Cami made three wishes on her birthday.'},
{word:'benches',single:'bench',sentence:'Grandma Kim sat on one of the benches in the park.'},
{word:'brushes',single:'brush',sentence:'Collins used two brushes to paint his picture.'},
{word:'pictures',single:'picture',sentence:'Jackie took pictures of Lily and Joey.'},
{word:'pieces',single:'piece',sentence:'Jaxson cut the pizza into eight pieces.'},
{word:'friend',sentence:'Jordan invited a friend to play.'},
{word:'because',sentence:'Lily barked because she heard a noise.'},
{word:'enough',sentence:'Grandma Kim made enough food for everyone.'},
{word:'together',sentence:'Lily and Joey played together.'}
];
const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let items=[],index=0,points=0,first=0,streak=0,tries=0,finished=false,missed=[],voice=null,speechToken=0;
const supported='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function chooseVoice(){if(!supported)return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='en-US'&&v.localService)||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en'))||null}
if(supported){chooseVoice();speechSynthesis.addEventListener('voiceschanged',chooseVoice)}else{$('support').textContent='This browser cannot read words aloud. Open this game in Chrome or Safari.';$('startBtn').disabled=true}
function speak(text){if(!supported)return;const token=++speechToken;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;if(voice)u.voice=voice;$('audioStatus').textContent='🔊 Speaking…';u.onend=()=>{if(token===speechToken)$('audioStatus').textContent='Tap a sound button to hear it again.'};u.onerror=e=>{if(token===speechToken&&e.error!=='canceled'&&e.error!=='interrupted')$('audioStatus').textContent='Audio did not play. Tap Hear the Word to retry; check your phone volume.'};speechSynthesis.speak(u)}
function prompt(q){return q.single?`More than one ${q.single}: ${q.word}. Spell ${q.word}.`:`The word is ${q.word}. Spell ${q.word}.`}
function show(id){['start','game','results'].forEach(x=>$(x).style.display=x===id?'block':'none')}
let audio;function chime(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();[523,659,784].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.1;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.09,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.2)})}catch(e){}}
function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<12;i++){const s=document.createElement('span');s.className='confetti';s.textContent=['⭐','✨','🎉'][i%3];s.style.left=(25+Math.random()*50)+'vw';s.style.top='43vh';s.style.setProperty('--x',(Math.random()*400-200)+'px');s.style.setProperty('--y',(-Math.random()*300-40)+'px');document.body.append(s);setTimeout(()=>s.remove(),900)}}
function stats(){$('round').textContent=`Word ${index+1}/${items.length}`;$('score').textContent=`⭐ ${points} pts`;$('streak').textContent=`🔥 ${streak} streak`;$('bar').style.width=index/items.length*100+'%'}
function render(){tries=0;finished=false;stats();$('spelling').value='';$('spelling').disabled=false;$('check').disabled=false;$('next').style.display='none';$('feedback').textContent='';$('audioStatus').textContent='';speak(prompt(items[index]))}
function start(list=words){items=shuffle(list);index=0;points=0;first=0;streak=0;missed=[];show('game');render()}
function check(event){event.preventDefault();if(finished)return;const value=$('spelling').value.trim().toLowerCase();if(!value){$('feedback').textContent='Type your spelling first.';return}tries++;const q=items[index];if(value===q.word){points+=tries===1?20:10;if(tries===1){first++;streak++}else streak=0;$('feedback').textContent=`🎉 Correct! ${q.word} — +${tries===1?20:10} points!`;chime();burst();finishWord()}else{streak=0;if(tries===1){missed.push(q);$('feedback').textContent='💪 Not quite. Listen again and give it another try!';speak(prompt(q));$('spelling').focus();$('spelling').select()}else{$('feedback').textContent=`The spelling is ${q.word}. ${q.word.split('').join(' · ')}. You’ll get another chance to practice!`;finishWord()}}stats()}
function finishWord(){finished=true;$('spelling').disabled=true;$('check').disabled=true;$('next').style.display='block';$('next').textContent=index===items.length-1?'See My Score 🏆':'Next Word ➜'}
function next(){if(!finished)return;index++;if(index<items.length){render();return}speechToken++;speechSynthesis.cancel();show('results');$('stars').textContent=first===items.length?'⭐⭐⭐':first>=items.length*.65?'⭐⭐':'⭐';$('final').textContent=`${points} POINTS`;$('summary').textContent=`Jaxson, you spelled ${first} of ${items.length} words correctly on your first try!`;$('missed').textContent=missed.length?'Practice these: '+missed.map(q=>q.word).join(' • '):'Perfect spelling! Every word right on the first try!';$('review').style.display=missed.length?'block':'none';burst()}
$('startBtn').onclick=()=>start();$('again').onclick=()=>start();$('review').onclick=()=>start([...missed]);$('hear').onclick=()=>speak(prompt(items[index]));$('sentence').onclick=()=>speak(items[index].sentence+' Spell '+items[index].word+'.');$('spellForm').onsubmit=check;$('next').onclick=next;
</script></body></html>
